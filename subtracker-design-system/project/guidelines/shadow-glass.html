<!-- @dsCard group="Brand" viewport="700x180" name="Shadow & Glass" subtitle="card · card-hover · glass · glow-primary · glow-accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-latin); background: linear-gradient(135deg, var(--brand-primary-050), var(--brand-accent-050)); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .box { background: #fff; height: 78px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--text-secondary); font-family: var(--font-mono); text-align: center; padding: 6px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="box" style="box-shadow:var(--shadow-card)">card</div>
    <div class="box" style="box-shadow:var(--shadow-card-hover)">card-hover</div>
    <div class="box" style="background:var(--glass-fill); backdrop-filter: blur(var(--glass-blur)); border:1px solid var(--glass-border); box-shadow:var(--shadow-glass)">glass</div>
    <div class="box" style="box-shadow:var(--shadow-glow-primary)">glow-primary</div>
    <div class="box" style="box-shadow:var(--shadow-glow-accent)">glow-accent</div>
  </div>
</body>
</html>
