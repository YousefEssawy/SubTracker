<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-latin); background: var(--bg-page); }
  .grad { height: 70px; border-radius: var(--radius-lg); background: var(--gradient-primary); box-shadow: var(--shadow-glow-primary); margin-bottom: 12px;

<body>
