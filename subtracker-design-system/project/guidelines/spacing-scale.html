<!-- @dsCard group="Spacing" viewport="700x260" name="Spacing Scale" subtitle="4px base scale used throughout the app" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-latin); background: var(--bg-page); color: var(--text-primary); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .bar { background: var(--brand-primary-500); height: 14px; border-radius: 3px; }
  .row b { width: 90px; font-size: 10.5px; color: var(--text-secondary); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row"><b>space-1 · 4px</b><div class="bar" style="width:4px"></div></div>
  <div class="row"><b>space-2 · 8px</b><div class="bar" style="width:8px"></div></div>
  <div class="row"><b>space-4 · 16px</b><div class="bar" style="width:16px"></div></div>
  <div class="row"><b>space-6 · 24px</b><div class="bar" style="width:24px"></div></div>
  <div class="row"><b>space-8 · 32px</b><div class="bar" style="width:32px"></div></div>
  <div class="row"><b>space-12 · 48px</b><div class="bar" style="width:48px"></div></div>
  <div class="row"><b>space-16 · 64px</b><div class="bar" style="width:64px"></div></div>
</body>
</html>
