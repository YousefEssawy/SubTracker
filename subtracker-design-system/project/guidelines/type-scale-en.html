<!-- @dsCard group="Type" viewport="700x330" name="Type Scale — English (Inter)" subtitle="display 40px down to caption 12px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-latin); background: var(--bg-page); color: var(--text-primary); }
  .row { border-bottom: 1px solid var(--border-subtle); padding: 10px 0; display: flex; align-items: baseline; gap: 14px; }
  .row:last-child { border-bottom: none; }
  .row b { font-size: 10px; color: var(--text-tertiary); width: 110px; flex-shrink: 0; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row"><b>display/40</b><span style="font-size:var(--text-display); font-weight:700; line-height:var(--leading-tight)">$1,250.00 Balance</span></div>
  <div class="row"><b>h1/30</b><span style="font-size:var(--text-h1); font-weight:700">Page Title</span></div>
  <div class="row"><b>h2/24</b><span style="font-size:var(--text-h2); font-weight:600">Section Title</span></div>
  <div class="row"><b>h3/20</b><span style="font-size:var(--text-h3); font-weight:600">Subheading</span></div>
  <div class="row"><b>body/16</b><span style="font-size:var(--text-body); line-height:var(--leading-normal)">Netflix subscription renews on the 5th every month</span></div>
  <div class="row"><b>body-sm/14</b><span style="font-size:var(--text-body-sm); color:var(--text-secondary)">Updated 3 days ago</span></div>
  <div class="row"><b>caption/12</b><span style="font-size:var(--text-caption); color:var(--text-tertiary)">JPEG, PNG or PDF up to 5 MB</span></div>
</body>
</html>
