<!-- @dsCard group="Type" viewport="700x330" name="Type Scale — Arabic (Cairo, RTL)" subtitle="Auto-activates on html[lang=ar] / dir=rtl, relaxed line-height" -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-page); color: var(--text-primary); }
  .row { border-bottom: 1px solid var(--border-subtle); padding: 10px 0; display: flex; align-items: baseline; gap: 14px; }
  .row:last-child { border-bottom: none; }
  .row b { font-size: 10px; color: var(--text-tertiary); width: 110px; flex-shrink: 0; font-family: var(--font-mono); direction: ltr; text-align: left; }
</style>
</head>
<body>
  <div class="row"><b>display/40</b><span style="font-size:var(--text-display); font-weight:700; line-height:var(--leading-tight)">١٢٥٠ ج.م الرصيد الحالي</span></div>
  <div class="row"><b>h1/30</b><span style="font-size:var(--text-h1); font-weight:700">عنوان الصفحة</span></div>
  <div class="row"><b>h2/24</b><span style="font-size:var(--text-h2); font-weight:600">عنوان قسم</span></div>
  <div class="row"><b>body/16</b><span style="font-size:var(--text-body)">اشتراك نتفليكس الشهري بيتجدد يوم ٥ كل شهر</span></div>
  <div class="row"><b>body-sm/14</b><span style="font-size:var(--text-body-sm); color:var(--text-secondary)">آخر تحديث من ٣ أيام</span></div>
  <div class="row"><b>caption/12</b><span style="font-size:var(--text-caption); color:var(--text-tertiary)">ملاحظة صغيرة</span></div>
</body>
</html>
