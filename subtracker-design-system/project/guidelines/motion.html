<!-- @dsCard group="Brand" viewport="700x160" name="Motion — Durations & Easing" subtitle="140/220/380ms · bounce (standard) vs plain decel (out)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-latin); background: var(--bg-page); color: var(--text-primary); }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .row b { width: 210px; font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); }
  .track { flex: 1; height: 8px; background: var(--ink-100); border-radius: 4px; position: relative; overflow: hidden; }
  .dot { position: absolute; top: -3px; left: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--brand-primary-500); animation: slide 1.8s infinite; }
  .standard .dot { animation-timing-function: var(--ease-standard); }
  .out .dot { animation-timing-function: var(--ease-out); background: var(--brand-accent-500); }
  @keyframes slide { 0% { left: 0; } 50% { left: calc(100% - 14px); } 100% { left: 0; } }
</style>
</head>
<body>
  <div class="row"><b>--ease-standard (bounce)</b><div class="track standard"><div class="dot"></div></div></div>
  <div class="row"><b>--ease-out (deceleration)</b><div class="track out"><div class="dot"></div></div></div>
  <div class="row"><b>fast 140 · base 220 · slow 380ms</b><span style="font-size:11px; color:var(--text-tertiary)">respects prefers-reduced-motion</span></div>
</body>
</html>
