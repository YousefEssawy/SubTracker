<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Colors" subtitle="Success / warning / danger — income, renewal, expense" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-latin); background: var(--bg-page); }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-card); }
  .sw .fill { height: 52px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; }
  .sw .label { background: var(--surface-card); padding: 5px 8px; font-size: 10.5px; color: var(--text-secondary); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="fill" style="background:var(--success-500)">Income / active</div><div class="label">success-500 #10B981</div></div>
    <div class="sw"><div class="fill" style="background:var(--warning-500)">Renewing soon</div><div class="label">warning-500 #F59E0B</div></div>
    <div class="sw"><div class="fill" style="background:var(--danger-500)">Expense / delete</div><div class="label">danger-500 #EF4444</div></div>
  </div>
</body>
</html>
