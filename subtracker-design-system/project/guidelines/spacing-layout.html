<!-- @dsCard group="Spacing" viewport="700x150" name="App Shell Layout Tokens" subtitle="Sidebar / collapsed sidebar / header height" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px 24px; font-family: var(--font-latin); background: var(--bg-page); }
  .demo { display: flex; border: 1px dashed var(--border-default); border-radius: var(--radius-md); overflow: hidden; height: 90px; }
  .sidebar { width: var(--sidebar-width); background: var(--ink-800); color: #fff; padding: 10px; font-size: 10.5px; font-family: var(--font-mono); }
  .collapsed { width: var(--sidebar-collapsed); background: var(--ink-700); color: #fff; padding: 10px 6px; font-size: 9px; font-family: var(--font-mono); text-align: center; }
  .col { display: flex; flex-direction: column; flex: 1; }
  .header { height: var(--header-height); background: var(--ink-100); display: flex; align-items: center; padding: 0 14px; font-size: 10.5px; font-family: var(--font-mono); color: var(--ink-700); }
  .body { flex: 1; background: var(--bg-page); }
</style>
</head>
<body>
  <div class="demo">
    <div class="sidebar">sidebar-width<br>260px</div>
    <div class="collapsed">72px</div>
    <div class="col">
      <div class="header">header-height · 64px</div>
      <div class="body"></div>
    </div>
  </div>
</body>
</html>
