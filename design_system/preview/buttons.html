<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Buttons — SubTracker Design System</title>
<link rel="stylesheet" href="../tokens.css" />
<style>
  body { font-family: var(--font-arabic); background: var(--bg-light); color: var(--ink-900); margin: 0; padding: 48px; }
  a.back { color: var(--brand-primary-600); text-decoration: none; font-weight: 600; }
  h2 { font-size: var(--text-h3); margin: 40px 0 12px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  button { font-family: inherit; font-size: var(--text-body-sm); font-weight: 600; border: none; cursor: pointer;
    padding: 10px 24px; border-radius: var(--radius-pill); transition: all var(--duration-base) var(--ease-standard); }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--brand-primary-500); color: #fff; }
  .btn-primary:hover { background: var(--brand-primary-600); box-shadow: var(--shadow-glow-primary); }
  .btn-secondary { background: var(--ink-100); color: var(--ink-700); }
  .btn-secondary:hover { background: var(--ink-200); }
  .btn-danger { background: var(--danger-500); color: #fff; }
  .btn-danger:hover { background: var(--danger-600); box-shadow: 0 12px 32px rgba(239,68,68,0.3); }
  .btn-gradient { background: linear-gradient(135deg, var(--brand-primary-500) 0%, var(--brand-accent-500) 100%); color: #fff; }
  .dark-panel { background: var(--bg-dark); padding: 32px; border-radius: var(--radius-lg); margin-top: 16px; }
  .dark-panel .btn-secondary { background: var(--surface-dark); color: var(--ink-200); }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; رجوع</a>
  <h1>الأزرار</h1>

  <h2>Light</h2>
  <div class="row">
    <button class="btn-primary">حفظ الاشتراك</button>
    <button class="btn-secondary">إلغاء</button>
    <button class="btn-danger">حذف</button>
    <button class="btn-gradient">ابدأ الآن</button>
  </div>

  <h2>Dark surface</h2>
  <div class="dark-panel row">
    <button class="btn-primary">حفظ الاشتراك</button>
    <button class="btn-secondary">إلغاء</button>
    <button class="btn-danger">حذف</button>
  </div>
</body>
</html>
