<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Inputs — SubTracker Design System</title>
<link rel="stylesheet" href="../tokens.css" />
<style>
  body { font-family: var(--font-arabic); background: var(--bg-light); color: var(--ink-900); margin: 0; padding: 48px; }
  a.back { color: var(--brand-primary-600); text-decoration: none; font-weight: 600; }
  form { max-width: 360px; display: flex; flex-direction: column; gap: 18px; margin-top: 24px; }
  label { font-size: var(--text-body-sm); font-weight: 600; color: var(--ink-700); margin-bottom: 4px; display: block; }
  input, select { width: 100%; padding: 10px 16px; border-radius: var(--radius-md); border: 1px solid var(--ink-200);
    background: #fff; font-family: inherit; font-size: var(--text-body); color: var(--ink-900);
    transition: all var(--duration-base) var(--ease-standard); }
  input:focus, select:focus { outline: none; border-color: var(--brand-primary-500);
    box-shadow: 0 0 0 3px var(--brand-primary-100); }
  input::placeholder { color: var(--ink-400); }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; رجوع</a>
  <h1>الإنبوتس</h1>

  <form onsubmit="return false">
    <div>
      <label>اسم الاشتراك</label>
      <input type="text" placeholder="نتفليكس" />
    </div>
    <div>
      <label>المبلغ</label>
      <input type="number" placeholder="0.00" />
    </div>
    <div>
      <label>الفئة</label>
      <select><option>ترفيه</option><option>عمل</option><option>تعليم</option></select>
    </div>
  </form>
</body>
</html>
