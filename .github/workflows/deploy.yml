name: Deploy to GitHub Pages

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Test functions
        run: npm run test
        working-directory: functions

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run emulator tests
        run: npm run test:emulator:ci

  deploy-firebase:
    needs: [build-and-deploy, emulator-tests]
    # Gated off until an operator completes the remaining prerequisite:
    # 1. [SATISFIED 2026-09-09] Export live production Firestore indexes (`firebase firestore:indexes --project subtraker-3dca8`
    #    verified: `{ "indexes": [], "fieldOverrides": [] }` — production has no composite indexes or overrides,
    #    so firestore.indexes.json matches production exactly and index deploy would delete nothing).
    #    NOTE: Production currently has no composite indexes, yet transaction queries combine equality filters
    #    with orderBy on a different field, causing failed-precondition errors in production today (tracked defect).
    #    WARNING: `firebase deploy --only firestore:indexes` is a declarative override; this becomes relevant
    #    again the moment an operator adds an index through the Firebase console.
    # 2. Add the FIREBASE_SERVICE_ACCOUNT secret to repository secrets (sole remaining blocker).
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Add node_modules bin to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Authenticate with Firebase Service Account
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > /tmp/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy rules, storage, and functions
        run: firebase deploy --only firestore:rules,storage,functions

      # Step B: This deploy is a declarative override which deletes any index or
      # fieldOverrides entry absent from firestore.indexes.json. The file currently
      # declares an empty set, so deploying it as-is would drop every production index.
      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes
